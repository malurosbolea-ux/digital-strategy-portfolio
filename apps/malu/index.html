<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbe3ef">
<meta name="description" content="María Luisa Ros Bolea: data, digital strategy and AI video, as an app.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Malu">
<title>Malu · María Luisa Ros Bolea</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--rose:#b4467f;--rose2:#e889b5;--pink:#fbe3ef;--pink2:#f6c7d9;--lilac:#dccdf6;--lilac2:#b48be6;--peach:#f9d8cb;--mint:#c7ecdf;--sky:#cfe2f8;--butter:#f9ebb3;--ink:#3b2748;--ink2:#6b5577;--bg:#fff7fb;--disp:"Unbounded",system-ui,sans-serif;--sans:"Outfit",system-ui,sans-serif;--ser:"Instrument Serif",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;--ease:cubic-bezier(.22,.9,.25,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--pink);color:var(--ink);font:400 15px/1.5 var(--sans)}
button,input{font:inherit;color:inherit;background:none;border:0}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:8px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
@media(min-width:520px){body{background:radial-gradient(circle at 20% 20%,var(--lilac),transparent 40%),radial-gradient(circle at 80% 70%,var(--peach),transparent 45%),var(--pink)}.app{border-radius:0;box-shadow:0 30px 90px rgba(180,70,127,.25)}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 130px);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .35s,transform .45s var(--ease);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;pointer-events:auto;transform:none}
h1{font:700 30px/1.02 var(--disp);letter-spacing:-.02em}
h2{font:700 22px/1.1 var(--disp);letter-spacing:-.01em}
h3{font:600 17px/1.25 var(--sans)}
.ser{font-family:var(--ser);font-style:italic;font-weight:400}
.muted{color:var(--ink2)}
.mono{font:500 11px var(--mono);letter-spacing:.04em}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font:700 18px var(--disp);color:var(--rose)}
.logo span{color:var(--ink)}
.lang{font:500 12px var(--mono);padding:7px 11px;border-radius:99px;background:#fff;border:1.5px solid var(--pink2)}
/* me */
.idcard{position:relative;border-radius:28px;padding:18px;background:linear-gradient(150deg,var(--pink2),var(--lilac) 70%,var(--sky));overflow:hidden}
.idcard::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;background:radial-gradient(var(--butter),transparent 70%);opacity:.8}
.idrow{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.ava{width:92px;height:92px;border-radius:24px;object-fit:cover;border:3px solid #fff;box-shadow:0 10px 24px rgba(180,70,127,.3);transform:rotate(-4deg)}
.idcard h1{font-size:25px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:99px;background:#fff;font:600 12px var(--sans);color:#2c7a5a}
.badge i{width:8px;height:8px;border-radius:50%;background:#4cc38a;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(76,195,138,.2)}}
.idcard p{position:relative;z-index:1;margin-top:14px;font-size:15px;line-height:1.45}
.idcard .ser{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{border-radius:20px;padding:12px 10px;background:#fff;border:1.5px solid var(--pink)}
.stat b{display:block;font:700 20px var(--disp);color:var(--rose)}
.stat span{font-size:12px;line-height:1.25;display:block;color:var(--ink2);margin-top:2px}
.sect{margin-top:26px}
.sect>.h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sect>.h a,.sect>.h button{font:600 13px var(--sans);color:var(--rose)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{border-radius:22px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.sv svg{width:30px;height:30px}
.sv h3{font-size:15px}
.sv p{font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:2px}
.c-pink{background:var(--pink)}.c-lilac{background:var(--lilac)}.c-mint{background:var(--mint)}.c-sky{background:var(--sky)}.c-peach{background:var(--peach)}.c-butter{background:var(--butter)}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.thumb{flex:none;width:132px;scroll-snap-align:start;text-align:left}
.thumb .im{position:relative;aspect-ratio:9/14;border-radius:20px;overflow:hidden;background:var(--lilac)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .im::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(59,39,72,.6))}
.thumb .pl{position:absolute;z-index:1;left:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}
.thumb .pl svg{width:12px;height:12px;fill:var(--rose)}
.thumb h4{font:600 13px/1.25 var(--sans);margin-top:7px}
/* reels */
#s-reels{padding:0;background:#1d1424}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;justify-content:center}
#s-reels{scroll-snap-type:y mandatory}
.reel .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.2) brightness(.65)}
.reel video{position:relative;z-index:1;width:100%;max-height:100%;object-fit:contain;background:#000}
.reel.vert video{height:100%;object-fit:cover}
.reel .ov{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:60px 76px calc(var(--sab) + 104px) 18px;background:linear-gradient(transparent,rgba(29,20,36,.85));color:#fff}
.reel .ov .mono{color:var(--pink2)}
.reel .ov h2{margin:4px 0 6px}
.reel .ov p{font-size:13.5px;opacity:.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reel .side{position:absolute;z-index:3;right:12px;bottom:calc(var(--sab) + 110px);display:flex;flex-direction:column;gap:14px;align-items:center}
.rb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;transition:transform .2s}
.rb:active{transform:scale(.9)}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.on{background:var(--rose2)}
.rb small{display:block;font:600 10px var(--sans);margin-top:3px;text-align:center}
.side label{font:600 10.5px var(--sans);color:#fff;text-align:center;margin-top:-8px}
.reel .tapmsg{position:absolute;z-index:2;top:calc(var(--sat) + 18px);left:18px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:600 12px var(--sans)}
.reel .prog{position:absolute;z-index:3;left:0;right:0;bottom:calc(var(--sab) + 88px);height:3px;background:rgba(255,255,255,.2)}
.reel .prog i{display:block;height:100%;width:0;background:var(--pink2)}
/* work */
.seg{display:flex;gap:6px;padding:4px;border-radius:99px;background:var(--pink);margin:14px 0 16px}
.seg button{flex:1;height:38px;border-radius:99px;font:600 13px var(--sans);color:var(--ink2);transition:all .3s}
.seg button.on{background:#fff;color:var(--rose);box-shadow:0 4px 12px rgba(180,70,127,.15)}
.pane{display:none}.pane.on{display:block;animation:in .4s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.proj{border-radius:26px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.proj .mono{color:var(--rose)}
.proj h2{margin:6px 0}
.proj p{font-size:14px;color:var(--ink2)}
.grade{position:absolute;right:16px;top:16px;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font:700 20px/1 var(--disp);color:var(--rose)}
.grade small{display:block;font:500 9px var(--mono);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.75);font:500 12.5px var(--sans)}
.apps{display:grid;gap:10px}
.appc{display:flex;gap:14px;align-items:center;padding:12px;border-radius:24px;background:#fff;border:1.5px solid var(--pink);text-align:left;width:100%}
.appc img{width:62px;height:62px;border-radius:16px;box-shadow:0 6px 14px rgba(59,39,72,.18)}
.appc div{flex:1}
.appc p{font-size:13px;color:var(--ink2)}
.appc .go{font:600 12.5px var(--sans);padding:8px 14px;border-radius:99px;background:var(--pink);color:var(--rose)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--pink2);border-radius:2px}
.ti{position:relative;padding:0 0 18px}
.ti::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--rose2)}
.ti .mono{color:var(--rose)}
.ti p{font-size:13.5px;color:var(--ink2)}
.skill{margin-bottom:14px}
.skill h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.skill h3 i{width:12px;height:12px;border-radius:4px}
/* contact */
.hello{border-radius:28px;padding:22px 18px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hello h1{font-size:27px}
.hello .ser{color:var(--pink2);font-size:30px}
.hello p{margin-top:10px;opacity:.85;font-size:14.5px}
.hello::after{content:"";position:absolute;right:-50px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(var(--rose2),transparent 70%);opacity:.5}
.links{display:grid;gap:10px;margin-top:14px}
.lk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:#fff;border:1.5px solid var(--pink)}
.lk .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.lk .ic svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk div{flex:1;min-width:0}
.lk b{display:block;font-weight:600}
.lk span{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lk em{font-style:normal;color:var(--rose);font-size:18px}
/* tabbar */
.tabs{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(var(--sab) + 12px);height:66px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(180,70,127,.2);border:1.5px solid #fff;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;color:var(--ink2);font:600 11px var(--sans);transition:all .3s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--pink);color:var(--rose)}
.app.dark .tabs{background:rgba(40,28,48,.75);border-color:rgba(255,255,255,.12)}
.app.dark .tab{color:rgba(255,255,255,.7)}
.app.dark .tab.on{background:rgba(232,137,181,.25);color:#fff}
/* mascot */
.pet{position:absolute;z-index:35;right:14px;bottom:calc(var(--sab) + 90px);width:62px;height:66px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(180,70,127,.3));transition:opacity .3s}
.pet svg{width:100%;height:100%}
.pet .dot{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--rose);border:2.5px solid #fff}
@keyframes bob{50%{transform:translateY(-5px)}}
.app.dark .pet,.app.dark .bubble{opacity:0;pointer-events:none}
.bubble{position:absolute;z-index:34;right:82px;bottom:calc(var(--sab) + 112px);max-width:200px;padding:9px 12px;border-radius:16px 16px 4px 16px;background:#fff;border:1.5px solid var(--pink2);font:500 12.5px/1.35 var(--sans);box-shadow:0 8px 20px rgba(180,70,127,.15);opacity:0;transform:scale(.8);transform-origin:100% 100%;transition:all .35s var(--ease);pointer-events:none}
.bubble.on{opacity:1;transform:none}
/* sheet & chat */
.sheet{position:absolute;inset:0;z-index:50;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(59,39,72,.35);opacity:0;transition:opacity .35s}
.sheet .body{position:absolute;left:0;right:0;bottom:0;height:86%;border-radius:30px 30px 0 0;background:var(--bg);transform:translateY(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column}
.sheet.on{pointer-events:auto}.sheet.on .scrim{opacity:1}.sheet.on .body{transform:none}
.chead{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1.5px solid var(--pink)}
.chead svg{width:44px;height:48px}
.chead div{flex:1}
.chead small{display:block;font-size:12px;color:#2c7a5a}
.chead .x{width:36px;height:36px;border-radius:50%;background:var(--pink);font-size:18px}
#msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.m{max-width:84%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;animation:in .3s var(--ease)}
.m.b{align-self:flex-start;background:#fff;border:1.5px solid var(--pink);border-bottom-left-radius:6px}
.m.u{align-self:flex-end;background:var(--rose);color:#fff;border-bottom-right-radius:6px}
.m a.inl{color:var(--rose);font-weight:600;text-decoration:underline}
.m .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m .acts button,.m .acts a{padding:6px 11px;border-radius:99px;background:var(--pink);color:var(--rose);font:600 12.5px var(--sans)}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--rose2);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-5px);opacity:.5}}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs button{flex:none;padding:8px 13px;border-radius:99px;background:#fff;border:1.5px solid var(--pink2);font:500 13px var(--sans)}
.cin{display:flex;gap:8px;padding:8px 14px calc(var(--sab) + 14px)}
.cin input{flex:1;height:48px;border-radius:99px;background:#fff;border:1.5px solid var(--pink2);padding:0 18px;font-size:15px}
.cin button{width:48px;height:48px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center}
.cin button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;z-index:70;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-20px);opacity:0;padding:10px 16px;border-radius:99px;background:var(--ink);color:#fff;font:500 13.5px var(--sans);transition:all .35s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.splash{position:absolute;inset:0;z-index:90;background:linear-gradient(160deg,var(--pink),var(--lilac));display:grid;place-items:center;transition:opacity .6s,visibility .6s}
.splash.off{opacity:0;visibility:hidden}
.splash div{text-align:center}
.splash svg{width:110px;height:120px;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.splash b{display:block;font:700 30px var(--disp);color:var(--rose);margin-top:8px;animation:fadeU .6s .3s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes fadeU{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

<section class="screen on" id="s-me">
  <div class="topbar"><span class="logo">malu<span>.app</span></span><button class="lang" id="lang">ES</button></div>
  <div class="idcard">
    <div class="idrow"><img class="ava" src="img/me.jpg" alt="María Luisa Ros Bolea"><div><h1>María Luisa<br>Ros Bolea</h1><span class="badge"><i></i><span data-t="avail"></span></span></div></div>
    <p><span class="ser" data-t="tagA"></span> <span data-t="tagB"></span></p>
  </div>
  <div class="stats">
    <div class="stat"><b>20K+</b><span data-t="st1"></span></div>
    <div class="stat"><b>9/10</b><span data-t="st2"></span></div>
    <div class="stat"><b>C1</b><span data-t="st3"></span></div>
  </div>
  <div class="sect"><div class="h"><h2 data-t="whatT"></h2></div><div class="svc" id="svc"></div></div>
  <div class="sect"><div class="h"><h2 data-t="reelsT"></h2><button data-go="reels" data-t="seeAll"></button></div><div class="strip" id="strip"></div></div>
  <div class="sect"><div class="h"><h2 data-t="appsT"></h2><button data-go="work" data-w="apps" data-t="seeAll"></button></div><div class="apps" id="appsMini"></div></div>
</section>

<section class="screen" id="s-reels" aria-label="Commercials"></section>

<section class="screen" id="s-work">
  <div class="topbar"><h1 data-t="workT"></h1><button class="lang" data-lang>ES</button></div>
  <div class="seg" id="seg"><button class="on" data-w="projects" data-t="wP"></button><button data-w="apps" data-t="wA"></button><button data-w="path" data-t="wC"></button><button data-w="skills" data-t="wS"></button></div>
  <div class="pane on" id="w-projects"></div>
  <div class="pane" id="w-apps"><p class="muted" data-t="appsP" style="margin-bottom:12px"></p><div class="apps" id="appsFull"></div></div>
  <div class="pane" id="w-path"><div class="tl" id="tl"></div></div>
  <div class="pane" id="w-skills" ></div>
</section>

<section class="screen" id="s-hi">
  <div class="topbar"><span class="logo">malu<span>.app</span></span><button class="lang" data-lang>ES</button></div>
  <div class="hello"><h1 data-t="hiT"></h1><span class="ser" data-t="hiS"></span><p data-t="hiP"></p></div>
  <div class="links" id="links"></div>
</section>

<nav class="tabs" aria-label="Main">
  <button class="tab on" data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="tMe"></span></button>
  <button class="tab" data-go="reels"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5v7l6-3.5z"/></svg><span data-t="tReels"></span></button>
  <button class="tab" data-go="work"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span data-t="tWork"></span></button>
  <button class="tab" data-go="hi"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-t="tHi"></span></button>
</nav>

<button class="pet" id="pet" aria-label="Chat with Pixel"><svg viewBox="0 0 120 130" id="petSvg"></svg><span class="dot"></span></button>
<div class="bubble" id="bubble"></div>

<div class="sheet" id="chat" role="dialog" aria-modal="true" aria-label="Pixel">
  <div class="scrim" data-close></div>
  <div class="body">
