<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MRB · Next-gen tech</title>
<meta name="description" content="MRB app: shop next-gen tech, book a VR demo and ask Nova, the MRB AI.">
<meta name="theme-color" content="#02040b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MRB Tech">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Orbitron";src:url(fonts/orbitron-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Orbitron";src:url(fonts/orbitron-latin-900-normal.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Exo 2";src:url(fonts/exo-2-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Exo 2";src:url(fonts/exo-2-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Exo 2";src:url(fonts/exo-2-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--bg:#02040b;--bg2:#060c1c;--panel:#0b1428;--panel2:#101c38;--ink:#eaf2ff;--dim:rgba(220,234,255,.64);--faint:rgba(200,222,255,.38);--line:rgba(130,175,255,.16);--line2:rgba(130,175,255,.3);--blue:#2a5bff;--el:#3d8bff;--cyan:#7fe8ff;--violet:#8f7bff;--grad:linear-gradient(100deg,#7fe8ff,#3d8bff 50%,#2a5bff);--ease:cubic-bezier(.22,1,.36,1);--d:"Orbitron",system-ui,sans-serif;--b:"Exo 2",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);font:15px/1.5 var(--b);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:radial-gradient(120% 60% at 50% -10%,#0d1d4a 0%,transparent 60%),var(--bg);overflow:hidden;isolation:isolate}
@media(min-width:520px){body{background:radial-gradient(80% 80% at 50% 30%,#0c1a3e,#000)}.app{box-shadow:0 0 0 1px var(--line),0 40px 120px rgba(42,91,255,.25)}}
.stars{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 12%,#fff6,transparent),radial-gradient(1px 1px at 85% 60%,#fff5,transparent),radial-gradient(1px 1px at 35% 80%,#fff4,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#7fe8ff88,transparent);opacity:.7}
/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 12px) 18px 10px;background:linear-gradient(var(--bg) 55%,transparent)}
.top .logo{height:20px;width:auto}
.top .sp{flex:1}
.pill{height:34px;min-width:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 11px var(--d);letter-spacing:.08em;color:var(--dim)}
.pill b{color:var(--ink);font-weight:700}
/* screens */
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 64px) 18px calc(var(--sab) + 172px);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;pointer-events:auto;transform:none}
h1,h2,h3{font-family:var(--d);font-weight:700;letter-spacing:.02em;line-height:1.1}
h2{font-size:22px;margin:4px 0 14px}
.sub{color:var(--dim);font-size:14px}
/* home orbit */
.hello{margin:6px 0 2px;font-size:13px;color:var(--faint)}
.orbit{position:relative;height:420px;margin:0 -18px;touch-action:pan-y;user-select:none}
.ring{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 30%,rgba(127,232,255,.9) 38%,transparent 46% 70%,rgba(143,123,255,.75) 78%,transparent 86%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64.5%,#000 66%,transparent 67.5%);mask:radial-gradient(circle,transparent 63%,#000 64.5%,#000 66%,transparent 67.5%);animation:spin 9s linear infinite}
.ring.r2{width:360px;height:360px;margin:-180px 0 0 -180px;opacity:.35;animation-duration:16s;animation-direction:reverse}
.halo{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:radial-gradient(circle,rgba(61,139,255,.35),transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
.orb-item{position:absolute;left:50%;top:44%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;overflow:hidden;transition:transform .6s var(--ease),opacity .6s var(--ease),filter .6s var(--ease);box-shadow:0 0 0 1px var(--line2),0 20px 60px rgba(0,0,0,.6)}
.orb-item img{width:100%;height:100%;object-fit:cover}
.orb-info{position:absolute;left:0;right:0;bottom:6px;text-align:center;padding:0 24px}
.orb-info .cat{font-size:12px;color:var(--cyan);letter-spacing:.06em}
.orb-info h1{font-size:34px;font-weight:900;margin:4px 0 2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.orb-info .price{font:700 15px var(--d);color:var(--ink)}
.orb-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.orb-dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .3s var(--ease),background .3s}
.orb-dots i.on{width:22px;background:var(--cyan)}
.orb-actions{display:flex;gap:10px;margin:18px 0 8px}
.btn{flex:1;height:50px;border-radius:14px;font:700 12px var(--d);letter-spacing:.1em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#020617;box-shadow:0 10px 30px rgba(61,139,255,.35)}
.btn.ghost{border:1px solid var(--line2);color:var(--ink)}
.promo{position:relative;margin-top:18px;border-radius:22px;overflow:hidden;min-height:180px;display:flex;align-items:flex-end;border:1px solid var(--line)}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(2,4,11,.92))}
.promo div{position:relative;z-index:1;padding:18px}
.promo h3{font-size:18px;margin-bottom:4px}
.promo p{font-size:13px;color:var(--dim);margin-bottom:12px}
.promo .btn{flex:none;height:40px;padding:0 16px;font-size:11px}
.row-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.row-title h3{font-size:15px}
.row-title button{font-size:13px;color:var(--cyan)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:138px;scroll-snap-align:start;text-align:left}
.mini .ph{aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px}
.mini .ph img{width:100%;height:100%;object-fit:cover}
.mini b{display:block;font:700 12px var(--d);letter-spacing:.03em}
.mini span{font-size:13px;color:var(--dim)}
/* shop */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);font-size:13px;color:var(--dim);transition:all .2s}
.chip.on{background:var(--ink);color:#020617;border-color:var(--ink);font-weight:600}
.plist{display:grid;gap:12px}
.pcard{display:grid;grid-template-columns:108px 1fr;gap:14px;align-items:center;padding:10px;border-radius:20px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);text-align:left;width:100%}
.pcard .ph{aspect-ratio:1;border-radius:14px;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .no{font:700 10px var(--d);color:var(--faint);letter-spacing:.1em}
.pcard h3{font-size:16px;margin:2px 0 4px}
.pcard p{font-size:13px;color:var(--dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:700 14px var(--d)}
.pcard .plus{width:32px;height:32px;border-radius:10px;background:rgba(61,139,255,.18);color:var(--cyan);display:grid;place-items:center;font-size:20px;line-height:1}
/* sheet */
.sheet{position:absolute;inset:0;z-index:40;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,2,10,.6);opacity:0;transition:opacity .35s}
.sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;background:var(--bg2);border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .45s var(--ease);padding-bottom:calc(var(--sab) + 18px);scrollbar-width:none}
.sheet.on{pointer-events:auto}
.sheet.on .scrim{opacity:1}
.sheet.on .body{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:12px}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:4/3.4;object-fit:cover;scroll-snap-align:center}
.gal-dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.gal-dots i{width:5px;height:5px;border-radius:3px;background:var(--line2)}
.gal-dots i.on{background:var(--cyan);width:16px}
.pd{padding:16px 20px 0}
.pd .badge{display:inline-block;font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(127,232,255,.12);color:var(--cyan);margin-bottom:10px}
.pd h2{font-size:28px;font-weight:900;margin:0}
.pd .price{font:700 18px var(--d);margin:6px 0 10px;color:var(--cyan)}
.pd .long{color:var(--dim);font-size:14px}
.sw{display:flex;gap:10px;margin:18px 0 6px;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--bg2);transition:border-color .2s}
.sw button.on{border-color:var(--cyan)}
.sw span{font-size:13px;color:var(--dim);margin-left:4px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden;margin:18px 0;border:1px solid var(--line)}
.specs div{background:var(--panel);padding:12px 14px}
.specs small{display:block;font-size:11px;color:var(--faint)}
.specs b{font:700 13px var(--d);letter-spacing:.02em}
.pd .actions{display:flex;gap:10px;position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg2) 30%)}
/* bag */
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty svg{margin:0 auto 16px;display:block}
.bitem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bitem img{width:72px;height:72px;border-radius:14px;object-fit:cover}
.bitem h3{font-size:14px}
.bitem small{color:var(--dim)}
.step{display:flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:12px;padding:2px}
.step button{width:30px;height:30px;border-radius:9px;font-size:18px}
.step span{min-width:18px;text-align:center;font:700 13px var(--d)}
.tot{margin:18px 0;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.tot div{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);padding:3px 0}
.tot div.g{color:var(--ink);font:700 18px var(--d);padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--faint);text-align:center;margin-top:12px}
/* demo */
.worlds{display:grid;gap:10px}
.world{position:relative;display:flex;align-items:flex-end;min-height:112px;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);text-align:left;padding:14px;transition:border-color .2s}
.world img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.world::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,4,11,.92) 30%,transparent)}
.world div{position:relative;z-index:1;max-width:70%}
.world h3{font-size:15px}
.world p{font-size:12px;color:var(--dim)}
.world.on{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(127,232,255,.15)}
.world .chk{position:absolute;z-index:2;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.world.on .chk{background:var(--cyan);border-color:var(--cyan);color:#020617}
.lbl{font:700 12px var(--d);letter-spacing:.08em;color:var(--faint);margin:22px 0 10px}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;height:72px;border-radius:16px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:11px;color:var(--faint)}
.day b{font:700 18px var(--d)}
.day.on{background:var(--grad);border-color:transparent;color:#020617}
.day.on small{color:#020617aa}
.day:disabled{opacity:.3}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:42px;border-radius:12px;border:1px solid var(--line2);font:600 13px var(--b)}
.slot.on{background:var(--ink);color:#020617;border-color:var(--ink)}
.slot:disabled{opacity:.25;text-decoration:line-through}
.guests{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;border:1px solid var(--line2)}
/* ticket */
.ticket{margin:10px 0 18px;border-radius:24px;background:linear-gradient(160deg,#14275a,#0b1428);border:1px solid var(--line2);overflow:hidden;position:relative}
.ticket .tt{padding:20px}
.ticket .tt h3{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ticket .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ticket small{display:block;font-size:11px;color:var(--faint)}
.ticket b{font:700 13px var(--d)}
.ticket .cut{border-top:2px dashed var(--line2);margin:0 16px;position:relative}
.ticket .cut::before,.ticket .cut::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket .cut::before{left:-28px}.ticket .cut::after{right:-28px}
.ticket .code{display:flex;align-items:center;gap:14px;padding:16px 20px}
.ticket .code svg{flex:none;background:#eaf2ff;border-radius:8px;padding:6px}
/* tabbar */
.tabs{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(var(--sab) + 12px);height:68px;border-radius:24px;background:rgba(10,18,38,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-size:11px;color:var(--faint);transition:color .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);background:rgba(61,139,255,.16)}
.tab .cnt{position:absolute;top:6px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cyan);color:#020617;font:700 10px/18px var(--d);text-align:center;transform:scale(0);transition:transform .3s var(--ease)}
.tab .cnt.on{transform:scale(1)}
.tab .cnt.pop{animation:pop .4s var(--ease)}
@keyframes pop{50%{transform:scale(1.4)}}
/* Nova AI */
.nova{position:absolute;z-index:31;right:18px;bottom:calc(var(--sab) + 92px);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff4ff,#3d8bff 55%,#1b2f8a);box-shadow:0 0 0 1px rgba(127,232,255,.5),0 0 28px rgba(61,139,255,.7);display:grid;place-items:center;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.nova .eye{width:24px;height:9px;border-radius:6px;background:#020617;position:relative;overflow:hidden}
.nova .eye::after{content:"";position:absolute;top:2px;left:3px;width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:11px 0 0 var(--cyan);animation:look 5s infinite}
@keyframes look{0%,40%,100%{transform:none}50%,70%{transform:translateX(5px)}92%{transform:scaleY(.1)}}
.nova-tip{position:absolute;z-index:31;right:84px;bottom:calc(var(--sab) + 104px);max-width:200px;padding:10px 12px;border-radius:14px 14px 4px 14px;background:var(--ink);color:#020617;font-size:12.5px;line-height:1.35;opacity:0;transform:translateY(6px);transition:all .4s var(--ease);pointer-events:none}
.nova-tip.on{opacity:1;transform:none}
.chat{display:flex;flex-direction:column;height:78vh;max-height:640px}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chat-h .av{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff4ff,#3d8bff 55%,#1b2f8a);display:grid;place-items:center}
.chat-h .av i{width:16px;height:6px;border-radius:4px;background:#020617}
.chat-h b{font:700 15px var(--d)}
.chat-h small{display:block;font-size:12px;color:var(--cyan)}
.chat-h .x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);font-size:18px}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.m{max-width:84%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45;animation:min .3s var(--ease)}
@keyframes min{from{opacity:0;transform:translateY(6px)}}
.m.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.me{align-self:flex-end;background:var(--el);color:#fff;border-bottom-right-radius:6px}
.m .pick{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border-radius:12px;background:rgba(2,4,11,.5);width:100%;text-align:left}
.m .pick img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.m .pick b{font:700 12px var(--d);display:block}
.m .pick span{font-size:12px;color:var(--dim)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none}
.sugg button{flex:none;font-size:12.5px;padding:8px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.composer{display:flex;gap:8px;padding:10px 14px 4px;border-top:1px solid var(--line)}
.composer input{flex:1;height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:0 14px;font:15px var(--b)}
.composer button{width:46px;height:46px;border-radius:14px;background:var(--grad);color:#020617;display:grid;place-items:center}
/* toast + splash */
.toast{position:absolute;z-index:60;left:50%;top:calc(var(--sat) + 16px);transform:translate(-50%,-140%);padding:10px 16px;border-radius:14px;background:var(--ink);color:#020617;font-size:13px;font-weight:600;transition:transform .4s var(--ease);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.splash{position:absolute;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
.splash.off{opacity:0;visibility:hidden}
.splash img{width:180px;animation:sp 1.4s var(--ease) both}
.splash .bar{position:absolute;bottom:22%;left:50%;width:120px;height:2px;margin-left:-60px;background:var(--line);overflow:hidden;border-radius:2px}

 if(!bag.length){$("#bag").innerHTML=`<div class="empty"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7fe8ff" stroke-width="1.2"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><p>${t("emptyBag")}</p><div class="orb-actions"><button class="btn primary" data-go="shop">${t("goShop")}</button></div></div>`;return}
 const sub=bag.reduce((a,b)=>a+byId(b.id).price*b.q,0);
 $("#bag").innerHTML=bag.map((b,i)=>{const p=byId(b.id);return `<div class="bitem"><img src="${img(p.img[0])}" alt=""><div><h3>${p.name}</h3><small>${L==="es"?p.colors[b.c][1]:p.colors[b.c][0]} · ${eur(p.price)}</small></div><div class="step"><button data-q="${i}" data-d="-1" aria-label="−">−</button><span>${b.q}</span><button data-q="${i}" data-d="1" aria-label="+">+</button></div></div>`}).join("")+`<div class="tot"><div><span>${t("sub")}</span><span>${eur(sub)}</span></div><div><span>${t("ship")}</span><span>${t("free")}</span></div><div class="g"><span>${t("total")}</span><span>${eur(sub)}</span></div></div><div class="orb-actions"><button class="btn primary" id="checkout">${t("checkout")}</button></div><p class="note">${t("concept")}</p>`;
 $("#checkout").onclick=()=>{bag=[];store.set("bag",bag);renderBag();toast(t("ordered")+" #MRB-"+Math.floor(1e4+Math.random()*9e4))}}
document.addEventListener("click",e=>{const q=e.target.closest("[data-q]");if(!q)return;const b=bag[+q.dataset.q];b.q+=+q.dataset.d;if(b.q<1)bag.splice(+q.dataset.q,1);store.set("bag",bag);renderBag()});

/* demo */
let D={w:"zero",day:null,time:null,g:1};
function renderDemo(){$("#worlds").innerHTML=W.map(w=>`<button class="world ${D.w===w.id?"on":""}" data-w="${w.id}"><img src="img/${w.img}-sm.webp" alt=""><div><h3>${tx(w.t)}</h3><p>${tx(w.d)} · ${w.min} min</p></div><span class="chk">${D.w===w.id?"✓":""}</span></button>`).join("");
 const days=[],now=new Date();for(let i=1;i<=14;i++){const d=new Date(now);d.setDate(now.getDate()+i);days.push(d)}
 const fmt=new Intl.DateTimeFormat(L==="es"?"es-ES":"en-GB",{weekday:"short"});
 $("#days").innerHTML=days.map(d=>{const k=d.toISOString().slice(0,10),sun=d.getDay()===0;return `<button class="day ${D.day===k?"on":""}" data-day="${k}" ${sun?"disabled":""}><small>${sun?t("closed"):fmt.format(d)}</small><b>${d.getDate()}</b></button>`}).join("");
 if(!D.day){$("#slots").innerHTML=`<p class="sub" style="grid-column:1/-1">${t("pickDay")}</p>`}else{const seed=[...D.day].reduce((a,c)=>a+c.charCodeAt(0),0);$("#slots").innerHTML=["10:00","11:00","12:00","13:00","16:00","17:00","18:00","19:00"].map((h,i)=>`<button class="slot ${D.time===h?"on":""}" data-time="${h}" ${(seed+i*7)%5===0?"disabled":""}>${h}</button>`).join("")}
 $("#gn").textContent=D.g}
document.addEventListener("click",e=>{const w=e.target.closest("[data-w]"),d=e.target.closest("[data-day]"),s=e.target.closest("[data-time]");if(w){D.w=w.dataset.w;renderDemo()}if(d){D.day=d.dataset.day;D.time=null;renderDemo()}if(s){D.time=s.dataset.time;renderDemo()}});
$("#gm").onclick=()=>{D.g=Math.max(1,D.g-1);renderDemo()};$("#gp").onclick=()=>{D.g=Math.min(4,D.g+1);renderDemo()};
function qr(seed){const n=21;let x=seed>>>0||7,r="";const fin=(R,C)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);if(e)r+=`<rect x="${C+j}" y="${R+i}" width="1" height="1"/>`}};fin(0,0);fin(0,n-7);fin(n-7,0);for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i<8&&j<8)||(i<8&&j>n-9)||(i>n-9&&j<8))continue;x=(x*1103515245+12345)>>>0;if((x>>>16)%100<48)r+=`<rect x="${j}" y="${i}" width="1" height="1"/>`}return `<svg width="84" height="84" viewBox="0 0 21 21" fill="#020617" shape-rendering="crispEdges">${r}</svg>`}
$("#book").onclick=()=>{if(!D.day||!D.time){toast(t("chooseAll"));return}const w=W.find(x=>x.id===D.w),d=new Date(D.day+"T12:00:00");const code="HX-"+(Math.abs([...D.day+D.time+D.w].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%9e5+1e5);
 $("#demoForm").hidden=true;const box=$("#demoDone");box.hidden=false;$("#s-demo").scrollTop=0;
 box.innerHTML=`<div class="ticket"><div class="tt"><small>Horizon X · ${tx(w.t)}</small><h3>${t("booked")}</h3><div class="grid"><div><small>${t("when")}</small><b>${new Intl.DateTimeFormat(L==="es"?"es-ES":"en-GB",{weekday:"short",day:"numeric",month:"short"}).format(d)} · ${D.time}</b></div><div><small>${t("who")}</small><b>${D.g}</b></div><div style="grid-column:1/-1"><small>${t("whereL")}</small><b>${t("lab")}</b></div></div></div><div class="cut"></div><div class="code">${qr(code.length*977+D.g)}<div><b>${code}</b><p class="sub">${t("showCode")}</p></div></div></div><div class="orb-actions"><button class="btn ghost" id="again">${t("another")}</button></div><p class="note">${t("concept")}</p>`;
 $("#again").onclick=()=>{D={w:"zero",day:null,time:null,g:1};box.hidden=true;$("#demoForm").hidden=false;renderDemo()}};

/* Nova AI */
const msgs=$("#msgs");
function say(html,who="ai"){const m=document.createElement("div");m.className="m "+who;m.innerHTML=html;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;return m}
function pickCard(p){return `<button class="pick" data-p="${p.id}"><img src="${img(p.img[0])}" alt=""><div><b>${p.name} · ${eur(p.price)}</b><span>${tx(p.short)}</span></div></button>`}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function answer(q){const n=norm(q);const es=L==="es";
 const budget=(n.match(/(\d{2,5})/)||[])[1];
 if(/hola|hello|hi\b|hey|buenas/.test(n))return es?"¡Hola! Puedo recomendarte un gadget, comparar productos, decirte el horario del lab o reservarte la demo VR.":"Hi! I can recommend a gadget, compare products, tell you the lab hours or book your VR demo.";
 if(/demo|reserv|book|probar|try/.test(n))return (es?"La demo de Horizon X es gratis y dura 30 minutos, en el lab de Fuencarral 41. ":"The Horizon X demo is free and takes 30 minutes at our lab on Fuencarral 41. ")+`<div class="orb-actions" style="margin:8px 0 0"><button class="btn primary" data-go="demo" data-close>${t("bookFree")}</button></div>`;
 if(/horario|hours|open|abre|abierto|cuando|where|donde|direcc|address/.test(n))return es?"MRB Lab está en Fuencarral 41, Madrid. Abrimos de lunes a sábado de 10:00 a 20:00. Los domingos, cerrado.":"MRB Lab is on Fuencarral 41, Madrid. We're open Monday to Saturday, 10:00 to 20:00. Closed on Sundays.";
 if(/envio|shipping|deliver|entrega|devol|return/.test(n))return es?"El envío es gratis en 24-48 h en península, y tienes 30 días para devolverlo sin dar explicaciones.":"Shipping is free and takes 24-48 h, and you have 30 days to return anything, no questions asked.";
 if(/compar|vs|diferen|difference/.test(n)&&/aura|buds|cascos|auricul|headphone|earbud/.test(n))return (es?"Aura One es para escuchar a fondo: cancelación de ruido −42 dB y 60 h. Pulse Buds es para moverte: 5 g, IPX5 y sensor de pulso.":"Aura One is for deep listening: −42 dB noise cancelling and 60 h. Pulse Buds is for moving: 5 g, IPX5 and a heart-rate sensor.")+pickCard(byId("aura-one"))+pickCard(byId("pulse-buds"));
 let scored=P.map(p=>({p,s:p.kw.split(" ").filter(k=>n.includes(k)).length+(n.includes(norm(p.name))?5:0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
 if(budget){const b=+budget;const fit=P.filter(p=>p.price<=b).sort((a,c)=>c.price-a.price);if(fit.length)return (es?`Con ${eur(b)} te recomiendo:`:`With ${eur(b)} I'd go for:`)+fit.slice(0,2).map(pickCard).join("");return es?`Con ${eur(b)} todavía no llegamos; lo más asequible es Pulse Buds.`+pickCard(byId("pulse-buds")):`${eur(b)} doesn't reach our range yet; the most affordable is Pulse Buds.`+pickCard(byId("pulse-buds"))}
 if(scored.length)return (es?"Esto es lo que mejor encaja contigo:":"This is what fits you best:")+scored.slice(0,2).map(x=>pickCard(x.p)).join("");
 if(/regalo|gift/.test(n))return (es?"Para regalar, Chrono S nunca falla, y si quieres algo más pequeño, Pulse Buds.":"As a gift, Chrono S never misses, and for something smaller, Pulse Buds.")+pickCard(byId("chrono-s"))+pickCard(byId("pulse-buds"));
 return es?"No estoy segura de haberte entendido. Prueba con algo como «auriculares para correr», «presupuesto 500» o «reservar demo».":"I'm not sure I got that. Try something like “earbuds for running”, “budget 500” or “book a demo”."}
function ask(q){if(!q.trim())return;say(q.replace(/</g,"&lt;"),"me");const ty=say('<span class="typing"><i></i><i></i><i></i></span>');setTimeout(()=>{ty.innerHTML=answer(q);msgs.scrollTop=msgs.scrollHeight},650+Math.random()*400)}
function renderSugg(){const s=L==="es"?["Auriculares para correr","Presupuesto 500 €","Algo para crear con IA","Reservar demo","Envíos y devoluciones"]:["Earbuds for running","Budget €500","Something to create with AI","Book a demo","Shipping and returns"];$("#sugg").innerHTML=s.map(x=>`<button>${x}</button>`).join("");$$("#sugg button").forEach(b=>b.onclick=()=>ask(b.textContent))}
$("#composer").onsubmit=e=>{e.preventDefault();ask($("#q").value);$("#q").value=""};
$("#nova").onclick=()=>{$("#novaTip").classList.remove("on");if(!msgs.children.length)say(t("novaHi"));openSheet("#cSheet")};
msgs.addEventListener("click",e=>{const p=e.target.closest("[data-p]");if(p){closeSheets();setTimeout(()=>openP(p.dataset.p),300)}});

function renderAll(){renderOrbit();renderShop();renderBag();renderDemo();renderSugg();$("#novaTip").textContent=t("tip")}
applyLang();
setTimeout(()=>$("#splash").classList.add("off"),matchMedia("(prefers-reduced-motion: reduce)").matches?0:1500);
setTimeout(()=>{if(!$(".sheet.on"))$("#novaTip").classList.add("on");setTimeout(()=>$("#novaTip").classList.remove("on"),4500)},3200);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
