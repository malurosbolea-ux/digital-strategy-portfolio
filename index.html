<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>María Luisa Ros Bolea | Digital Strategy & Big Data</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@300;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* PALETA GAMER GIRL / PASTEL TECH */
            --bg-dark: #0f0c29; 
            --bg-secondary: #1a1a2e;
            --pastel-pink: #ffb7d5; 
            --pastel-purple: #e0b0ff;
            --pastel-cyan: #89cff0; /* Pastel Blue */
            --pastel-yellow: #fdffb6;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.1);
            --neon-glow: 0 0 15px rgba(155, 246, 255, 0.3);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ==================== LIGHTBOX ==================== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center; align-items: center;
        }

        .lightbox.active { display: flex; }

        .lightbox-content {
            max-width: 90%; max-height: 90%;
            position: relative;
            border: 2px solid var(--pastel-purple);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(224, 176, 255, 0.4);
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 100%; max-height: 85vh;
            border-radius: 12px; display: block;
        }

        .lightbox-close {
            position: absolute; top: 20px; right: 20px;
            color: var(--pastel-pink); font-size: 3rem;
            cursor: pointer; transition: all 0.3s; z-index: 10000;
        }

        .lightbox-close:hover { transform: rotate(90deg) scale(1.2); }

        /* ==================== ANIMATED BACKGROUNDS ==================== */
        .animated-bg {
            background: radial-gradient(circle at 50% 50%, #241b4d 0%, #0f0c29 100%);
            position: relative;
        }

        /* ==================== HERO SECTION ==================== */
        .homepage {
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 60px 20px; text-align: center;
        }

        .hero-label {
            color: var(--pastel-cyan);
            letter-spacing: 8px; margin-bottom: 20px;
            text-transform: uppercase; text-shadow: 0 0 10px var(--pastel-cyan);
        }

        .hero-title {
            font-size: 6rem; font-weight: 700;
            background: linear-gradient(to right, var(--pastel-pink), var(--pastel-purple), var(--pastel-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 15px; line-height: 1.1;
            text-shadow: 0 0 30px rgba(224, 176, 255, 0.3);
        }

        .hero-subtitle {
            font-size: 1.8rem; color: var(--text-muted);
            margin-bottom: 40px; font-weight: 300;
        }

        .hero-cta { display: flex; gap: 25px; justify-content: center; }

        .btn-glow {
            padding: 18px 40px;
            font-weight: 700;
            font-size: 1.1rem; text-decoration: none;
            border-radius: 5px; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.4s;
            position: relative; overflow: hidden;
        }

        .btn-primary:hover {
            background: var(--pastel-pink); color: var(--bg-dark);
            box-shadow: 0 0 40px rgba(255, 183, 213, 0.6);
        }

        .btn-secondary:hover {
            background: var(--pastel-cyan); color: var(--bg-dark);
            box-shadow: 0 0 40px rgba(155, 246, 255, 0.6);
        }

        /* ==================== NAVIGATION ==================== */
        .nav-bar {
            background: rgba(15, 12, 41, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-container {
            display: flex; justify-content: center;
            padding: 0 20px; flex-wrap: wrap;
        }

        .nav-link {
            background: transparent; border: none;
            color: var(--text-muted); padding: 20px 30px;
            font-weight: 700; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--pastel-purple);
            text-shadow: 0 0 10px var(--pastel-purple);
        }

        /* ==================== SECTIONS ==================== */
        .section {
            display: none; padding: 100px 20px;
            max-width: 1400px; margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .section-header { text-align: center; margin-bottom: 80px; }

        .section-title {
            font-size: 3.5rem;
            color: var(--pastel-purple); text-transform: uppercase;
            margin-bottom: 15px; text-shadow: 0 0 20px rgba(224, 176, 255, 0.4);
        }

        .section-tagline { color: var(--text-muted); font-size: 1.2rem; letter-spacing: 1px; }

        /* ==================== ABOUT ==================== */
        .about-layout {
            display: grid; grid-template-columns: 400px 1fr; gap: 60px;
        }

        .profile-box {
            background: var(--bg-secondary); padding: 40px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; position: sticky; top: 100px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .profile-photo {
            width: 250px; height: 250px;
            border-radius: 50%; border: 4px solid var(--pastel-pink);
            box-shadow: 0 0 30px rgba(255, 183, 213, 0.4);
            margin-bottom: 30px; object-fit: cover;
        }

        .profile-name {
            font-size: 2.2rem;
            color: white; margin-bottom: 10px;
        }

        .profile-title { color: var(--pastel-cyan); font-weight: 600; margin-bottom: 30px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 15px; border-radius: 10px;
        }

        .stat-value {
            display: block; font-size: 1.4rem;
            font-weight: 800; color: var(--pastel-purple);
            font-family: 'Orbitron', sans-serif;
        }

        .stat-desc { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }

        .cv-btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--pastel-pink), var(--pastel-purple));
            color: var(--bg-dark); font-weight: 700;
            padding: 15px 30px; border-radius: 30px;
            text-decoration: none; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s;
        }

        .cv-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 183, 213, 0.6); }

        .about-main {
            background: var(--bg-secondary); padding: 50px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
        }

        .intro-text { font-size: 1.1rem; color: #dcdcdc; margin-bottom: 50px; }
        .intro-text strong { color: var(--pastel-pink); }

        .block-title {
            font-size: 2rem;
            color: var(--pastel-cyan); margin-bottom: 30px;
            border-left: 4px solid var(--pastel-purple); padding-left: 20px;
        }

        .skills-layout {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px;
        }

        .skill-box {
            background: rgba(255,255,255,0.03); padding: 25px;
            border-radius: 15px; transition: 0.3s;
        }

        .skill-box:hover { background: rgba(255,255,255,0.06); transform: translateY(-5px); }
        .skill-box h4 { color: var(--pastel-pink); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .skill-box ul { list-style: none; color: #ccc; }
        .skill-box li { margin-bottom: 8px; display: flex; gap: 10px; }
        .skill-box li::before { content: '>'; color: var(--pastel-cyan); font-weight: bold; }

        /* ==================== GALLERY & CAROUSELS ==================== */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .gallery-card, .carousel-card {
            background: var(--bg-secondary); border-radius: 20px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .gallery-card:hover, .carousel-card:hover {
            transform: translateY(-10px); border-color: var(--pastel-purple);
            box-shadow: 0 0 50px rgba(224, 176, 255, 0.15);
        }

        /* Single Media */
        .card-media {
            height: 350px; position: relative;
            cursor: pointer; overflow: hidden;
        }

        .card-media img, .card-media video {
            width: 100%; height: 100%;
            object-fit: cover; transition: 0.5s;
        }

        .gallery-card:hover .card-media img { transform: scale(1.1); }

        /* Grid Media (The 4-block style) */
        .carousel-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 175px);
            gap: 2px; background: var(--bg-dark);
        }

        .carousel-item {
            position: relative; width: 100%; height: 100%;
            overflow: hidden; cursor: pointer;
        }

        .carousel-item img, .carousel-item video {
            width: 100%; height: 100%;
            object-fit: cover; transition: 0.4s; opacity: 0.9;
        }

        .carousel-item:hover img, .carousel-item:hover video {
            transform: scale(1.1); opacity: 1; z-index: 2;
        }

        .carousel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(224, 176, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s;
        }

        .carousel-item:hover .carousel-overlay { opacity: 1; }
        .carousel-overlay i { font-size: 2rem; color: white; text-shadow: 0 0 10px black; }

        .card-info { padding: 25px; }
        
        .card-title { font-size: 1.4rem; margin-bottom: 10px; color: white; }
        
        .card-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; }
        
        .card-tags { display: flex; gap: 10px; flex-wrap: wrap; }
        .tag {
            background: rgba(255,255,255,0.1); color: var(--pastel-cyan);
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem;
            text-transform: uppercase; font-weight: 700;
            border: 1px solid var(--pastel-cyan);
        }

        /* Banners Branding */
        .branding-banner {
            width: 100%; height: 200px; margin-bottom: 30px;
            border-radius: 15px; overflow: hidden;
            border: 1px solid var(--pastel-purple);
            position: relative; cursor: pointer;
            background: black;
        }

            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5
